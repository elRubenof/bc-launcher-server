name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm build:web

      - name: Check that openapi.json is up to date
        run: |
          pnpm openapi
          git diff --exit-code packages/contracts/openapi.json

  api-compat:
    # Breaking changes to what launchers use (/api/v1 and discovery), against the latest release
    # (vX.Y.Z tag), or the pull request's base / the previous push while there is no release yet.
    runs-on: ubuntu-latest
    env:
      OASDIFF_VERSION: 1.34.1
      OASDIFF_SHA256: 75775f65b0adebd26a8e013af51a799342dfdc6262d89efa9e3b7bdf89657d90
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install oasdiff
        run: |
          curl -sSfL -o "$RUNNER_TEMP/oasdiff.tar.gz" \
            "https://github.com/oasdiff/oasdiff/releases/download/v${OASDIFF_VERSION}/oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz"
          echo "${OASDIFF_SHA256}  $RUNNER_TEMP/oasdiff.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/oasdiff.tar.gz" -C "$RUNNER_TEMP" oasdiff

      - name: Check /api/v1 and discovery for breaking changes
        env:
          FALLBACK_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          spec=packages/contracts/openapi.json
          base=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)
          base=${base:-$FALLBACK_BASE}
          if [ -z "$base" ] || ! git cat-file -e "$base:$spec" 2>/dev/null; then
            echo "No earlier openapi.json to compare with (base: ${base:-none}), skipping."
            exit 0
          fi
          echo "Comparing with $base"
          git show "$base:$spec" > "$RUNNER_TEMP/base.json"
          "$RUNNER_TEMP/oasdiff" breaking --fail-on ERR \
            --match-path '^/(api/v1/|\.well-known/)' "$RUNNER_TEMP/base.json" "$spec"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -f docker/Dockerfile -t bc-launcher-server:ci .

      - name: Smoke test
        run: |
          docker run -d --name server -p 3000:3000 \
            -e PUBLIC_URL=http://localhost:3000 \
            bc-launcher-server:ci
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/health; then break; fi
            sleep 1
          done
          curl -sf http://localhost:3000/health
          curl -sf http://localhost:3000/.well-known/bc-launcher
          curl -sf http://localhost:3000/admin/login | grep -q '<div id="root">'
          docker logs server
