name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm build:web

      - name: Check that openapi.json is up to date
        run: |
          pnpm openapi
          git diff --exit-code packages/contracts/openapi.json

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -f docker/Dockerfile -t bc-launcher-server:ci .

      - name: Smoke test
        run: |
          docker run -d --name server -p 3000:3000 \
            -e PUBLIC_URL=http://localhost:3000 -e SESSION_SECRET=$(openssl rand -hex 32) -e JWT_SECRET=$(openssl rand -hex 32) \
            bc-launcher-server:ci
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/health; then break; fi
            sleep 1
          done
          curl -sf http://localhost:3000/health
          curl -sf http://localhost:3000/.well-known/bc-launcher
          curl -sf http://localhost:3000/admin/login | grep -q '<div id="root">'
          docker logs server
