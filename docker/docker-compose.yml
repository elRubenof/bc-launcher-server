# Example deployment with the published image. Put it behind a reverse proxy with TLS and set
# PUBLIC_URL to its public origin. Settings go in docker/.env (never committed): PUBLIC_URL
# and JWT_SECRET (32+ random characters, e.g. `openssl rand -hex 32`).
# `docker compose up -d` pulls the image; `docker compose up --build` builds it from this checkout.
services:
  server:
    image: ghcr.io/elrubenof/bc-launcher-server:${SERVER_VERSION:-latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in docker/.env}
    volumes:
      - data:/data

volumes:
  data:
